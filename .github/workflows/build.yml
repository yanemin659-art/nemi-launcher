name: NEMI Launcher Cloud Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-2022
    steps:
      - name: Checkout NEMI repository
        uses: actions/checkout@v4

      - name: Checkout Helix launcher source
        uses: actions/checkout@v4
        with:
          repository: HelixLauncher/HelixLauncher
          ref: main
          path: source/HelixLauncher-main

      - name: Apply NEMI interface files
        shell: pwsh
        run: |
          Get-ChildItem "windows-ui" -Filter "*.qml" | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination "source/HelixLauncher-main/helixlauncher-gui/qml/" -Force
          }
          if (!(Test-Path "source/HelixLauncher-main/helixlauncher-gui/qml/main.qml")) {
            throw "NEMI interface files were not applied"
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Qt 5.15.2
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          cache: true

      - name: Build customized NEMI launcher
        working-directory: source/HelixLauncher-main
        shell: pwsh
        run: |
          $main = "helixlauncher-gui/src/main.rs"
          $source = Get-Content -Raw $main
          # Do not force KDE's desktop style: it is not part of the Windows Qt deployment.
          # Qt's built-in Basic style is shipped with Qt Quick Controls.
          $source = $source.Replace('QQuickStyle::set_style("org.kde.desktop")', 'QQuickStyle::set_style("Basic")')
          if ($source -notmatch '#!\[windows_subsystem\s*=\s*"windows"\]') {
            $source = '#![windows_subsystem = "windows"]' + "`r`n" + $source
          }
          Set-Content -Path $main -Value $source -NoNewline
          cargo build --release -p helixlauncher-gui
          $exe = "target/release/helixlauncher-gui.exe"
          if (!(Test-Path $exe)) { throw "NEMI launcher executable was not produced" }
          New-Item -ItemType Directory -Force -Path "../../dist/windows/app" | Out-Null
          Copy-Item $exe "../../dist/windows/app/NEMI-LAUNCHER.exe"
          if (!(Get-Command windeployqt -ErrorAction SilentlyContinue)) {
            throw "windeployqt was not found; Qt deployment cannot be packaged."
          }
          windeployqt --release --compiler-runtime --qmldir "helixlauncher-gui/qml" "../../dist/windows/app/NEMI-LAUNCHER.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Create single-file Windows installer
        shell: pwsh
        run: |
          @'
          [Setup]
          AppId={{A6D8B5F0-7C4E-4A35-9D21-6E4A1B8C2031}
          AppName=NEMI LAUNCHER
          AppVersion=0.1.0
          AppPublisher=NEMI Studios
          DefaultDirName={autopf}\NEMI LAUNCHER
          DefaultGroupName=NEMI LAUNCHER
          OutputDir=dist\windows
          OutputBaseFilename=NEMI-LAUNCHER-Setup
          ArchitecturesInstallIn64BitMode=x64
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern

          [Files]
          Source: "dist\windows\app\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\NEMI LAUNCHER"; Filename: "{app}\NEMI-LAUNCHER.exe"
          Name: "{autodesktop}\NEMI LAUNCHER"; Filename: "{app}\NEMI-LAUNCHER.exe"

          [Run]
          Filename: "{app}\NEMI-LAUNCHER.exe"; Description: "NEMI LAUNCHER başlat"; Flags: postinstall nowait skipifsilent
          '@ | Set-Content -Encoding ASCII "nemi-installer.iss"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc "nemi-installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup packaging failed" }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: NEMI-LAUNCHER-Windows
          path: dist/windows/NEMI-LAUNCHER-Setup.exe
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build Android Minecraft Java APK
    runs-on: ubuntu-latest
    steps:
      - name: Install Java 8 toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set Java 21 as build runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Checkout Amethyst Android engine
        uses: actions/checkout@v4
        with:
          repository: AngelAuraMC/Amethyst-Android
          ref: v3_openjdk
          submodules: recursive
          path: amethyst

      - name: Apply NEMI Launcher branding
        working-directory: amethyst
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("app_pojavlauncher/build.gradle")
          text = gradle.read_text()
          text = text.replace('resValue "string", "app_name", "Amethyst (Debug)"', 'resValue "string", "app_name", "NEMİ LAUNCHER"')
          text = text.replace('resValue "string", "app_short_name", "Amethyst (Debug)"', 'resValue "string", "app_short_name", "NEMİ"')
          text = text.replace('resValue "string", "app_name", "Amethyst"', 'resValue "string", "app_name", "NEMİ LAUNCHER"')
          text = text.replace('resValue "string", "app_short_name", "Amethyst"', 'resValue "string", "app_short_name", "NEMİ"')
          gradle.write_text(text)
          layout = Path("app_pojavlauncher/src/main/res/layout/fragment_launcher.xml")
          text = layout.read_text()
          text = text.replace(
              '<com.kdt.mcgui.LauncherMenuButton\n\t\t\t\tandroid:id="@+id/news_button"',
              '<TextView\n\t\t\t\tandroid:id="@+id/nemi_brand_title"\n\t\t\t\tandroid:layout_width="match_parent"\n\t\t\t\tandroid:layout_height="wrap_content"\n\t\t\t\tandroid:paddingStart="20dp"\n\t\t\t\tandroid:paddingTop="22dp"\n\t\t\t\tandroid:paddingBottom="18dp"\n\t\t\t\tandroid:text="NEMİ LAUNCHER"\n\t\t\t\tandroid:textColor="@color/primary_text"\n\t\t\t\tandroid:textSize="24sp"\n\t\t\t\tandroid:textStyle="bold"\n\t\t\t\tapp:layout_constraintTop_toTopOf="parent" />\n\t\t\t<com.kdt.mcgui.LauncherMenuButton\n\t\t\t\tandroid:id="@+id/news_button"'
          )
          text = text.replace('app:layout_constraintTop_toTopOf="parent"\n\t\t\t\tapp:layout_constraintStart_toStartOf="parent"\n\t\t\t\tapp:layout_constraintEnd_toStartOf="@id/social_divider"', 'app:layout_constraintTop_toBottomOf="@id/nemi_brand_title"\n\t\t\t\tapp:layout_constraintStart_toStartOf="parent"\n\t\t\t\tapp:layout_constraintEnd_toStartOf="@id/social_divider"', 1)
          text = text.replace('app:layout_constraintTop_toTopOf="parent"\n\t\t\t\tapp:layout_constraintStart_toEndOf="@id/social_divider"', 'app:layout_constraintTop_toBottomOf="@id/nemi_brand_title"\n\t\t\t\tapp:layout_constraintStart_toEndOf="@id/social_divider"', 1)
          layout.write_text(text)
          strings = Path("app_pojavlauncher/src/main/res/values/strings.xml")
          text = strings.read_text().replace('<string name="app_name" translatable="false">Amethyst</string>', '<string name="app_name" translatable="false">NEMİ LAUNCHER</string>')
          strings.write_text(text)
          PY

      - name: Build Android APK
        working-directory: amethyst
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app_pojavlauncher:assembleDebug
          mkdir -p ../dist/android
          cp app_pojavlauncher/build/outputs/apk/debug/*.apk ../dist/android/NEMI-LAUNCHER-Android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: NEMI-LAUNCHER-Android
          path: dist/android/NEMI-LAUNCHER-Android.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish direct EXE and APK downloads
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: NEMI-LAUNCHER-Windows
          path: release/windows

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: NEMI-LAUNCHER-Android
          path: release/android

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nemi-latest
          name: NEMI LAUNCHER — Latest Build
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release/windows/NEMI-LAUNCHER-Setup.exe
            release/android/NEMI-LAUNCHER-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
